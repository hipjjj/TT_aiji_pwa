name: Deploy Xiaobao AI backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaobao-ai-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUTRITION_API_KEY: ${{ secrets.NUTRITION_API_KEY }}
      ACCESS_CODE: ${{ secrets.NUTRITION_ACCESS_CODE }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check configuration names without printing values
        run: |
          node --input-type=module - <<'JS'
          for (const name of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','NUTRITION_API_KEY','ACCESS_CODE']) {
            if (!process.env[name]) throw new Error(`Required repository secret is missing: ${name}`);
          }
          if (process.env.ACCESS_CODE.length < 16) throw new Error('NUTRITION_ACCESS_CODE must contain at least 16 characters');
          JS
      - run: npm ci
      - run: npm test
      - name: Verify upgraded chat model before deploying
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const config=readFileSync('server/wrangler.toml','utf8');
          const model=config.match(/^CHAT_MODEL = "([^"]+)"/m)?.[1];
          if (!model) throw new Error('CHAT_MODEL is missing');
          const photo='data:image/png;base64,';
          const response=await fetch('https://api.openai.com/v1/responses',{
            method:'POST',headers:{Authorization:`Bearer ${process.env.NUTRITION_API_KEY}`,'Content-Type':'application/json'},
            body:JSON.stringify({model,store:false,...(/^gpt-5-mini(?:-|$)/.test(model)?{reasoning:{effort:'minimal'}}:{}),input:[{role:'user',content:[{type:'input_text',text:'What is the main color of this image? Answer in Chinese in the color field.'},{type:'input_image',image_url:photo,detail:'low'}]}],max_output_tokens:1200,text:{format:{type:'json_schema',name:'vision_preflight',strict:true,schema:{type:'object',additionalProperties:false,required:['color'],properties:{color:{type:'string'}}}}}}),signal:AbortSignal.timeout(35000)
          });
          if (!response.ok) throw new Error(`Chat model preflight failed with HTTP ${response.status}; current deployed model has not been changed`);
          const output=await response.json();
          const text=(output.output||[]).flatMap(x=>x.content||[]).filter(x=>x.type==='output_text').map(x=>x.text).join('');
          if (output.status!=='completed'||!JSON.parse(text).color.includes('红')) throw new Error('Chat vision/structured-output preflight failed; current deployed model has not been changed');
          console.log(`PASS: ${model} supports this account, image input and strict JSON output`);
          JS
      - name: Verify exam vision model before deploying
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {examInstructions,examSchema} from './server/grading.mjs';
          import {validateExamRecognition} from './src/grading/model.mjs';
          const model=readFileSync('server/wrangler.toml','utf8').match(/^GRADING_MODEL = "([^"]+)"/m)?.[1];
          if (!model) throw new Error('GRADING_MODEL is missing');
          const photo='data:image/png;base64,'+readFileSync('tests/fixtures/choice-paper.png').toString('base64');
          const response=await fetch('https://api.openai.com/v1/responses',{
            method:'POST',headers:{Authorization:`Bearer ${process.env.NUTRITION_API_KEY}`,'Content-Type':'application/json'},
            body:JSON.stringify({model,store:false,...(/^gpt-5(?:-20\d\d-\d\d-\d\d)?$/.test(model)?{reasoning:{effort:'minimal'}}:{}),instructions:examInstructions,input:[{role:'user',content:[{type:'input_text',text:JSON.stringify({questionCount:3,task:'只提取学生作答，不解题、不判分'})},{type:'input_image',image_url:photo,detail:'high'}]}],max_output_tokens:3000,text:{format:{type:'json_schema',name:'exam_answers',strict:true,schema:examSchema}}}),signal:AbortSignal.timeout(65000)
          });
          if (!response.ok) throw new Error(`Exam model preflight failed with HTTP ${response.status}; previous backend has not been changed`);
          const output=await response.json();
          const text=(output.output||[]).flatMap(x=>x.content||[]).filter(x=>x.type==='output_text').map(x=>x.text).join('');
          if (output.status!=='completed') throw new Error('Exam model preflight did not complete');
          const result=validateExamRecognition(JSON.parse(text),3);
          if (result.answers.map(x=>x.answer).join('')!=='BDA') throw new Error('Exam model failed synthetic marked-circle recognition; previous backend has not been changed');
          console.log(`PASS: ${model} accurately reads synthetic multiple-choice marks with high-detail vision and strict JSON`);
          JS
      - name: Deploy Worker and quota storage
        id: worker
        run: |
          set -o pipefail
          npm run worker:deploy | tee "$RUNNER_TEMP/xiaobao-deploy.log"
          node --input-type=module - <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const output=readFileSync(`${process.env.RUNNER_TEMP}/xiaobao-deploy.log`,'utf8');
          const url=output.match(/https:\/\/tt-aiji-pwa-xiaobao-ai\.[a-z0-9-]+\.workers\.dev/i)?.[0];
          if (!url) throw new Error('Worker URL was not returned by deployment');
          appendFileSync(process.env.GITHUB_OUTPUT,`url=${url}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`小包 AI 服务地址：${url}\n\n请在个人页的 AI 设置中填写此地址及你自行设置的访问口令。\n`);
          JS
      - name: Set backend secrets without logging them
        run: |
          node --input-type=module - <<'JS'
          import {spawn} from 'node:child_process';
          const child=spawn('npx',['wrangler','secret','bulk','--config','server/wrangler.toml'],{stdio:['pipe','inherit','inherit']});
          child.stdin.end(JSON.stringify({NUTRITION_API_KEY:process.env.NUTRITION_API_KEY,ACCESS_CODE:process.env.ACCESS_CODE}));
          child.on('error',()=>process.exit(1));
          child.on('exit',code=>process.exit(code??1));
          JS
      - name: Verify deployed nutrition, recipe, travel and chat services
        env:
          SERVICE_URL: ${{ steps.worker.outputs.url }}
        run: |
          node --input-type=module - <<'JS'
          import {validateAIAnalysis} from './src/nutrition/model.mjs';
          import {defaultPreferences,validateAIRecipeResult} from './src/fridge/model.mjs';
          import {validateStoryResult} from './src/travel/model.mjs';
          import {validateChatResult} from './src/chat/model.mjs';
          const origin='https://hipjjj.github.io';
          let ready=false;
          for (let attempt=0;attempt<6;attempt++) {
            const response=await fetch(`${process.env.SERVICE_URL}/health`,{headers:{Origin:origin},signal:AbortSignal.timeout(15000)});
            const health=await response.json();
            ready=response.ok && health.ready===true && health.chatModel==='gpt-5-mini' && health.model==='gpt-4.1-mini' && health.gradingModel==='gpt-5';
            if (ready) break;
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          if (!ready) throw new Error('Deployed backend did not become ready');
          const response=await fetch(`${process.env.SERVICE_URL}/analyze`,{
            method:'POST',headers:{Origin:origin,'Content-Type':'application/json','X-Access-Code':process.env.ACCESS_CODE},
            body:JSON.stringify({text:'熟米饭150克，水煮鸡蛋1个',photo:null}),signal:AbortSignal.timeout(45000)
          });
          if (!response.ok) throw new Error(`Live AI verification failed with HTTP ${response.status}; check Worker configuration and OpenAI billing`);
          const result=validateAIAnalysis(await response.json());
          if (!result.foods.length) throw new Error('Live AI verification returned no food');
          console.log('PASS: deployed health, authentication, quota storage, and real OpenAI text analysis');
          const recipes=await fetch(`${process.env.SERVICE_URL}/recipes`,{
            method:'POST',headers:{Origin:origin,'Content-Type':'application/json','X-Access-Code':process.env.ACCESS_CODE},
            body:JSON.stringify({mode:'dish',dish:'番茄炒蛋',inventory:[{name:'番茄',quantity:'2',unit:'个'},{name:'鸡蛋',quantity:'3',unit:'个'}],preferences:defaultPreferences}),signal:AbortSignal.timeout(45000)
          });
          if (!recipes.ok) throw new Error(`Live recipe verification failed with HTTP ${recipes.status}`);
          if (!validateAIRecipeResult(await recipes.json()).recipes.length) throw new Error('Live recipe verification returned no recipes');
          console.log('PASS: real OpenAI recipe recommendation');
          const story=await fetch(`${process.env.SERVICE_URL}/travel-story`,{
            method:'POST',headers:{Origin:origin,'Content-Type':'application/json','X-Access-Code':process.env.ACCESS_CODE},
            body:JSON.stringify({title:'东京的小旅行',startDate:'2026-10-01',endDate:'2026-10-03',stops:[{city:'日本·东京',spots:['浅草寺']}],note:'在街边看到了喜欢的小店。'}),signal:AbortSignal.timeout(45000)
          });
          if (!story.ok) throw new Error(`Live travel story verification failed with HTTP ${story.status}`);
          validateStoryResult(await story.json());
          console.log('PASS: real OpenAI overseas travel story draft');
          const chat=await fetch(`${process.env.SERVICE_URL}/chat`,{
            method:'POST',headers:{Origin:origin,'Content-Type':'application/json','X-Access-Code':process.env.ACCESS_CODE},
            body:JSON.stringify({mode:'鲍比',messages:[{speaker:'用户',text:'鲍比，请生成三张待确认卡片：1今天午饭35元餐饮账单；2今天午餐饮食，熟米饭150克和水煮鸡蛋50克，请估算四项营养；3冰箱添加冷藏牛奶1盒。'}],memories:[],growth:0,today:new Date().toISOString().slice(0,10)}),signal:AbortSignal.timeout(45000)
          });
          if (!chat.ok) throw new Error(`Live chat verification failed with HTTP ${chat.status}`);
          const chatResult=validateChatResult(await chat.json(),'鲍比');
          if (!chatResult.proposals.some(p=>p.kind==='账单'&&p.cents===3500&&p.category==='餐饮'&&p.date===new Date().toISOString().slice(0,10))) throw new Error('Live chat failed to generate an expense confirmation card');
          if (!chatResult.proposals.some(p=>p.kind==='饮食'&&p.mealType==='午餐'&&p.foods.length===2)) throw new Error('Live chat failed to generate meal nutrition confirmation');
          if (!chatResult.proposals.some(p=>p.kind==='食材'&&p.name.includes('牛奶')&&p.location==='冷藏')) throw new Error('Live chat failed to generate fridge confirmation');
          console.log('PASS: real OpenAI expense, meal nutrition and fridge cards; no user records were saved');
          const {readFileSync}=await import('node:fs');
          const {validateExamRecognition,gradeExam}=await import('./src/grading/model.mjs');
          const paper='data:image/png;base64,'+readFileSync('tests/fixtures/choice-paper.png').toString('base64');
          const exam=await fetch(`${process.env.SERVICE_URL}/grade-exam`,{
            method:'POST',headers:{Origin:origin,'Content-Type':'application/json','X-Access-Code':process.env.ACCESS_CODE},
            body:JSON.stringify({questionCount:3,photo:paper}),signal:AbortSignal.timeout(80000)
          });
          if (!exam.ok) throw new Error(`Live exam verification failed with HTTP ${exam.status}`);
          const examResult=validateExamRecognition(await exam.json(),3);
          if (examResult.answers.map(x=>x.answer).join('')!=='BDA') throw new Error('Live exam endpoint misread synthetic answer marks');
          const graded=gradeExam({id:'main',title:'Synthetic check',questionCount:3,key:['B','D','A'],points:[2,3,5],updatedAt:1},examResult.answers.map(x=>({...x,confirmed:true})));
          if (graded.earned!==10||graded.total!==10) throw new Error('Local deterministic exam scoring failed');
          console.log('PASS: deployed GPT-5 answer recognition and local 10/10 score; no student data or records used');
          JS
